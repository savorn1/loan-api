spring.application.name=accounting-service
server.port=8086

# DB
spring.datasource.url=jdbc:postgresql://localhost:5432/accounting_db
spring.datasource.username=postgres
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.pool-name=HikariPool-accounting

# JPA
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# JWT — must match the secret in auth-service and api-gateway
jwt.secret=${JWT_SECRET}

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.tags.application=${spring.application.name}

# Default starter chart of accounts, created on first boot (per-account, keyed
# by accountNo so re-running after partial seeding only fills in what's missing).
seed.gl-accounts.enabled=true
seed.gl-accounts.currency=USD

# ReconciliationScheduler emails this address when the daily Loans Receivable check finds a
# mismatch. Unset by default — there's no real ops distribution list configured for this
# system, so alerting is opt-in rather than sending to a made-up address.
reconciliation.alert-email=
