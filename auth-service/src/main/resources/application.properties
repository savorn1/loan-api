spring.application.name=auth-service
server.port=8081

# DB
spring.datasource.url=jdbc:postgresql://localhost:5432/auth_db
spring.datasource.username=postgres
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Redis — caches each logged-in user's flattened RBAC permission list under
# session:<uuid> (see UserSessionStore). Additive: the JWT still carries the base
# role claim and is still what the gateway/hasRole('ADMIN') checks rely on: this
# cache is for the separate permission-name list, not for authenticating requests.
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=123456
# Session TTL, hours — matches jwt.expiration (24h) so a still-valid access token
# never outlives its cached permission list.
redis.session.expire-hours=24

# JWT — must match the secret in api-gateway
jwt.secret=5JzoMqNmIFBDIk6nEqB6tCrLn2FGH4KkPcVpTZFm3UsXgYwRdUaE8lVjQ9sHbON0
jwt.expiration=86400000
# Refresh token lifetime (7 days), stored server-side in refresh_tokens so it can be revoked
jwt.refresh-expiration=604800000

# Actuator
management.endpoints.web.exposure.include=health,info

# Default admin account, created on first boot if a user with this username
# doesn't already exist yet (registration always creates Role.USER accounts).
seed.admin.enabled=true
seed.admin.username=admin
seed.admin.password=admin123

# Starter RBAC reference data: CRUD permissions per domain resource, an ADMIN role (all
# permissions) and a VIEWER role (read-only), with the seeded admin user attached to ADMIN.
seed.rbac.enabled=true
