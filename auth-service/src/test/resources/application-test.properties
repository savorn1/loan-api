# StorageAutoConfiguration (common-storage) only wires FileStorageService when S3_ENDPOINT
# is set (@ConditionalOnProperty) — without it, AuthServiceImpl's constructor can't be
# satisfied and contextLoads() fails before ever reaching a test assertion. Only bean
# construction happens here (S3Client.builder().build() doesn't make a network call), so
# these don't need to point at a real MinIO for this test to pass.
S3_ENDPOINT=http://localhost:9000
S3_BUCKET=test-bucket
