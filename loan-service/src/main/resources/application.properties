spring.application.name=loan-service
server.port=8083

# DB
spring.datasource.url=jdbc:postgresql://localhost:5432/loans_db
spring.datasource.username=postgres
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.pool-name=HikariPool-loan

# JPA
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# JWT — must match the secret in auth-service and api-gateway
jwt.secret=${JWT_SECRET}

# MinIO/S3 document uploads (common-storage) — AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY/
# AWS_REGION/S3_BUCKET/S3_ENDPOINT are read directly from the environment, see .env.example
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.tags.application=${spring.application.name}

# Overdue installments — see OverdueInstallmentScheduler. rate-percent is a flat,
# system-wide late-fee rate (not per-product — Loan has no productId to look one up
# by); set auto-charge-enabled=false to only flag OVERDUE without charging a penalty.
loan.penalty.overdue.auto-charge-enabled=true
loan.penalty.overdue.rate-percent=5

# Feign call timeouts for customer-service/loan-product-service specifically — the two
# clients EligibilityServiceImpl fans out to (up to 4 calls per check). No override
# existed before this, so calls were on Spring Cloud OpenFeign's defaults (10s connect /
# 60s read) — long enough for one hung downstream call to tie up a request thread for a
# minute. Scoped per-client rather than feign.client.config.default so this doesn't
# change behavior for this service's other Feign clients (accounting/payment/branch/
# notification-service), which haven't shown a need for a tighter bound.
feign.client.config.customer-service.connect-timeout=2000
feign.client.config.customer-service.read-timeout=5000
feign.client.config.loan-product-service.connect-timeout=2000
feign.client.config.loan-product-service.read-timeout=5000

# Circuit breaker for EligibilityServiceImpl.checkEligibility, which fans out to up to 4
# Feign calls (customer-service x3, loan-product-service x1) per check — trips after 50%
# of the last 10 calls fail, stays open 15s before probing again with 3 trial calls.
# Advisory feature only (see EligibilityServiceImpl's fallback), so a short trip is fine.
resilience4j.circuitbreaker.instances.eligibilityCheck.sliding-window-size=10
resilience4j.circuitbreaker.instances.eligibilityCheck.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.eligibilityCheck.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.instances.eligibilityCheck.permitted-number-of-calls-in-half-open-state=3
