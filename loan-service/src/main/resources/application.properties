spring.application.name=loan-service
server.port=8083

# DB
spring.datasource.url=jdbc:postgresql://localhost:5432/loans_db
spring.datasource.username=postgres
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.pool-name=HikariPool-loan

# JPA
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# JWT — must match the secret in auth-service and api-gateway
jwt.secret=${JWT_SECRET}

# MinIO/S3 document uploads (common-storage) — AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY/
# AWS_REGION/S3_BUCKET/S3_ENDPOINT are read directly from the environment, see .env.example
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.tags.application=${spring.application.name}

# Overdue installments — see OverdueInstallmentScheduler. rate-percent is a flat,
# system-wide late-fee rate (not per-product — Loan has no productId to look one up
# by); set auto-charge-enabled=false to only flag OVERDUE without charging a penalty.
loan.penalty.overdue.auto-charge-enabled=true
loan.penalty.overdue.rate-percent=5
