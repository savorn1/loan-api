spring.application.name=notification-service
server.port=8087

# DB
spring.datasource.url=jdbc:postgresql://localhost:5432/notification_db
spring.datasource.username=postgres
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.pool-name=HikariPool-notification

# JPA
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# JWT — must match the secret in auth-service and api-gateway
jwt.secret=${JWT_SECRET}

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.tags.application=${spring.application.name}

# Mail — defaults target Mailhog (a local SMTP catcher, no real provider/creds
# needed for dev). Overridden via SPRING_MAIL_* env vars in docker-compose to
# point at the mailhog container by service name instead of localhost.
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
notification.mail.from=noreply@loanms.local
