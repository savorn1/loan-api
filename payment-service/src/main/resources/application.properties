spring.application.name=payment-service
server.port=8084

# DB
spring.datasource.url=jdbc:postgresql://localhost:5432/payment_db
spring.datasource.username=postgres
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.pool-name=HikariPool-payment

# JPA
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Redis (for rate limiting — see RateLimitAspect, applied to PaymentController.create)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=123456

# JWT — must match the secret in auth-service and api-gateway
jwt.secret=${JWT_SECRET}

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.tags.application=${spring.application.name}

# Reminders
notification.reminder.due-soon-days=3

# payment-wallet Merchant API integration (deposit collection) — see PaymentWalletClient
# and PaymentWalletWebhookController. api-key is the raw "{keyId}.{secret}" X-API-Key
# value issued by a payment-wallet admin for this merchant account. webhook-secret is
# read back from GET /api/merchant/webhook on payment-wallet after pointing its
# PUT /api/merchant/webhook at this service's /api/payments/webhooks/payment-wallet
# (through api-gateway). Only used for PaymentGateway rows whose provider is
# "PAYMENT_WALLET" — every other gateway/channel is unaffected if left unset.
payment-wallet.api-key=${PAYMENT_WALLET_API_KEY:}
payment-wallet.webhook-secret=${PAYMENT_WALLET_WEBHOOK_SECRET:}

# PaymentWalletReconciliationScheduler — fallback poll for deposits stuck PENDING
# because a webhook delivery was dropped (payment-wallet doesn't retry those).
payment-wallet.reconciliation.interval-ms=300000
payment-wallet.reconciliation.grace-period-minutes=5
